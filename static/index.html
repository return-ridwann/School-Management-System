<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">School Management System</a>
            <div class="d-flex align-items-center">
                <span id="server-status" class="badge bg-secondary">Checking server...</span>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 text-center">
                        <h1 class="h3 card-title fw-bold mb-3">Welcome to School Portal</h1>
                        <p class="card-text text-muted mb-4">
                            Access student records, course information, grades, and administrative tools in one unified dashboard.
                        </p>
                        <div class="d-grid gap-2">
                            <a href="/login.html" class="btn btn-primary btn-lg">Go to Login</a>
                        </div>
                    </div>
                    <div class="card-footer bg-white border-top-0 pb-3 text-center">
                        <small class="text-muted">
                            System Health: <span id="footer-status" class="badge bg-secondary">Connecting...</span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/health')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('HTTP error ' + response.status);
                    }
                    return response.json();
                })
                .then(data => {
                    const statusText = data.status === 'ok' ? 'Server Status: Online' : 'Server Status: Degraded';
                    const badgeClass = data.status === 'ok' ? 'badge bg-success' : 'badge bg-warning text-dark';

                    const navBadge = document.getElementById('server-status');
                    if (navBadge) {
                        navBadge.className = badgeClass;
                        navBadge.textContent = statusText;
                    }

                    const footerBadge = document.getElementById('footer-status');
                    if (footerBadge) {
                        footerBadge.className = badgeClass;
                        footerBadge.textContent = statusText;
                    }
                })
                .catch(err => {
                    console.error('Failed to connect to health endpoint:', err);
                    const navBadge = document.getElementById('server-status');
                    if (navBadge) {
                        navBadge.className = 'badge bg-danger';
                        navBadge.textContent = 'Server Status: Offline';
                    }
                    const footerBadge = document.getElementById('footer-status');
                    if (footerBadge) {
                        footerBadge.className = 'badge bg-danger';
                        footerBadge.textContent = 'Server Status: Offline';
                    }
                });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
