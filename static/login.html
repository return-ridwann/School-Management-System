<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card login-card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h1 class="h4 fw-bold">School Management System</h1>
                    <p class="text-muted small">Sign in to your account</p>
                </div>

                <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@school.edu" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100">Sign In</button>
                </form>
            </div>
            <div class="card-footer bg-white border-top-0 text-center pb-3">
                <small class="text-muted">Default admin: admin@school.edu / admin123</small>
            </div>
        </div>
    </div>

    <script>
        // redirect if already logged in
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.role === 'admin') {
                        window.location.href = '/admin.html';
                    } else if (data.role === 'teacher') {
                        window.location.href = '/teacher.html';
                    } else if (data.role === 'student') {
                        window.location.href = '/student.html';
                    }
                }
            } catch (err) {
                                // if not logged in remain on login page
            }
        });

        // handle login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const alertBox = document.getElementById('errorAlert');
            alertBox.classList.add('d-none');
            alertBox.textContent = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    alertBox.textContent = data.error || 'Invalid email or password';
                    alertBox.classList.remove('d-none');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                    return;
                }

                if (data.role === 'admin') {
                    window.location.href = '/admin.html';
                } else if (data.role === 'teacher') {
                    window.location.href = '/teacher.html';
                } else if (data.role === 'student') {
                    window.location.href = '/student.html';
                } else {
                    window.location.href = '/login.html';
                }
            } catch (err) {
                alertBox.textContent = 'Network error. Please try again.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
